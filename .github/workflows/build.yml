name: Build and deploy Roll
on:
  push:
    branches: [main]
    paths-ignore: ['drafts/**', 'README.md', 'docs/**']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      sync_youtube:
        description: Fetch new public YouTube uploads
        type: boolean
        default: false
      import_stills:
        description: Publish currently unprocessed image-inbox files as one Stills group
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: roll-pages
  queue: max
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: fivsevn-agy/fivsevn-spec
          ref: main
          path: .metadata-spec
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify shared contract copies
        run: |
          cmp scripts/site_post_metadata.py .metadata-spec/tools/site_post_metadata.py
          cmp scripts/media_naming.py .metadata-spec/tools/media_naming.py
          cmp schemas/content-metadata.schema.json .metadata-spec/content/content-metadata.schema.json
          cmp schemas/site-post.schema.json .metadata-spec/content/site-post.schema.json
      - name: Verify tests before importing content
        run: python -m unittest discover -s tests -v
      - name: Verify Motion return navigation
        run: node --test tests/test_motion_navigation.mjs
      - name: Publish this push's Stills image batch
        if: github.event_name == 'push'
        run: python scripts/import_stills.py --event-path "$GITHUB_EVENT_PATH" --stage
      - name: Publish a manually requested Stills image batch
        if: github.event_name == 'workflow_dispatch' && inputs.import_stills == true
        run: python scripts/import_stills.py --manual --stage
      - name: Append new verified YouTube uploads
        if: github.event_name == 'schedule' || inputs.sync_youtube == true
        env:
          YOUTUBE_FIVSEVN_CHANNEL_ID: ${{ secrets.YOUTUBE_FIVSEVN_CHANNEL_ID }}
        run: python scripts/sync_youtube.py
      - name: Validate publication media and metadata
        run: |
          python scripts/media_naming.py check --site stills --root stills
          python .metadata-spec/tools/check_metadata.py --profile site-post-v1 --site stills --content-root stills --root . --schema .metadata-spec/content/content-metadata.schema.json
          python scripts/media_naming.py check --site motion --root motion
          python .metadata-spec/tools/check_metadata.py --profile site-post-v1 --site motion --content-root motion --root . --schema .metadata-spec/content/content-metadata.schema.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: python scripts/build.py --base-path "${{ steps.pages.outputs.base_path }}"
      - run: python scripts/check.py --base-path "${{ steps.pages.outputs.base_path }}"
      - name: Skip an unchanged scheduled deployment
        id: content
        run: |
          python - <<'PY_GATE'
          import json, os
          from pathlib import Path
          import requests
          publish = True
          if os.environ['GITHUB_EVENT_NAME'] == 'schedule':
              receipt = json.loads(Path('_site/build-receipt.json').read_text())
              url = 'https://' + Path('CNAME').read_text().strip() + '/build-receipt.json'
              try:
                  response = requests.get(url, params={'v': receipt['fingerprint']}, timeout=30)
                  response.raise_for_status()
                  publish = response.json() != receipt
              except (requests.RequestException, ValueError):
                  pass
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('changed=' + str(publish).lower() + '\n')
          PY_GATE
      - name: Save generated packages without overwriting concurrent edits
        if: steps.content.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The Stills importer staged only its exact new package and ledger.
          git add -- motion
          if ! git diff --cached --quiet; then
            git commit -m 'publish: Save Stills upload batch and verified YouTube uploads'
          fi
          for attempt in 1 2 3; do
            git fetch origin main
            previous_head=$(git rev-parse HEAD)
            git rebase FETCH_HEAD
            if [ "$(git rev-parse HEAD)" != "$previous_head" ]; then
              python -m unittest discover -s tests -v
              node --test tests/test_motion_navigation.mjs
              python scripts/build.py --base-path "${{ steps.pages.outputs.base_path }}"
              python scripts/check.py --base-path "${{ steps.pages.outputs.base_path }}"
            fi
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo '::error::Main kept changing. Rerun this push workflow; its upload batch is preserved in Git history.'
              exit 1
            fi
          done
      - uses: actions/upload-pages-artifact@v4
        if: steps.content.outputs.changed == 'true'
        with:
          path: _site
      - name: Check that this deployment still represents the latest main
        if: steps.content.outputs.changed == 'true'
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
      - id: deployment
        if: steps.content.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
      - name: Verify all public page and media bytes
        if: steps.content.outputs.changed == 'true'
        run: python scripts/verify_live.py --url "${{ steps.deployment.outputs.page_url }}"
      - name: Clear only image uploads that were verified live
        if: steps.content.outputs.changed == 'true'
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo 'Newer work arrived. The live site is verified; inbox copies are retained for the next run.'
            exit 0
          fi
          python scripts/stills_inbox.py
          git add -u -- stills/trigger_imgs
          if ! git diff --cached --quiet; then
            git commit -m 'publish: Clear verified Stills image inbox copies'
            if ! git push origin HEAD:main; then
              echo 'Newer work arrived during cleanup. Remote inbox copies are retained; published originals are safe.'
            fi
          fi
