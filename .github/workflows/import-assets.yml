name: Archive reviewed Roll originals
on:
  push:
    branches: [codex/migrate-roll]
    paths: [migration/PENDING, .github/workflows/import-assets.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: roll-import
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/codex/migrate-roll'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Retrieve only manifest-pinned originals and verify SHA-256
        run: python scripts/restore_assets.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py
      - run: python scripts/check.py
      - name: Archive originals on the migration branch
        run: |
          git fetch origin codex/migrate-roll
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f migration/PENDING
          git add -- stills drafts site-assets migration/PENDING
          if ! git diff --cached --quiet; then
            git commit -m 'migration: Archive checksum-verified published and draft originals'
            git push origin HEAD:codex/migrate-roll
          fi
